<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashwick</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0b0c10; color: #f4ead8; font: 17px/1.4 Georgia, serif; }
  .sky { min-height: 46vh; background: radial-gradient(circle at 50% 80%, #3a2a16, #0b0c10 62%); position: relative; }
  .hero { padding: 28px 18px 12px; }
  h1 { margin: 8vh 0 4px; letter-spacing: .16em; font-weight: normal; font-size: 32px; }
  a { color: #e2c27a; }
  .muted { color: #cbb892; }
  .walk { display: flex; gap: 12px; overflow-x: auto; padding: 8px 16px 18px; scroll-snap-type: x mandatory; }
  .door { scroll-snap-align: start; min-width: 168px; background: #16140f; border: 1px solid #4a3d28; border-radius: 14px; padding: 14px; }
  .door b { display: block; font-size: 18px; }
  .kind { color: #e2c27a; font-size: 14px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 8px 12px; margin-top: 8px; background: #e2c27a; color: #1a140c; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; background: #14120e; border-top: 1px solid #4a3d28; padding: 18px 18px 28px; transform: translateY(110%); transition: .2s; }
  .sheet.open { transform: none; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-top: 1px solid #2c261c; }
  .k { color: #9c9078; }
  .ghost { background: transparent; color: #e2c27a; border: 1px solid #e2c27a; }
</style>
</head>
<body>
<div class="sky"><div class="hero">
  <h1>ASHWICK</h1>
  <p>First Wick. Walk the signs. Tap one.</p>
  <p class="muted">Take the lamp. Rent the sign. Or go into the shop. Nothing is sold yet.</p>
  <p><a href="keys.html">The 24 keys</a> · <a href="rules.html">The rules</a></p>
</div></div>
<div class="walk" id="walk"></div>
<div class="sheet" id="sheet">
  <b id="name"></b>
  <div class="kind" id="kind"></div>
  <div class="row"><span class="k">Price to take it</span><span id="price"></span></div>
  <div class="row"><span class="k">In the box</span><span id="box"></span></div>
  <div class="row"><span class="k">Sign rent</span><span id="rent"></span></div>
  <button id="take">Take the lamp</button>
  <button class="ghost" id="lease">Rent the sign</button>
  <button class="ghost" id="shop">Enter the shop</button>
  <p class="muted" id="note"></p>
</div>
<script>
const lamps = [
  ["The Hearth","house","90 USDG","empty","not offered"],
  ["Loaf and Ember","shop","70 USDG","15 USDG","4 USDG / week"],
  ["The Lantern Inn","inn","180 USDG","40 USDG","8 USDG / week"],
  ["Clerk and Quill","shop","80 USDG","empty","3 USDG / week"],
  ["The Counter","shop","75 USDG","6 USDG","3 USDG / week"],
  ["Open Shelf","shop","110 USDG","1 stock token","5 USDG / week"],
  ["Needle and Thread","shop","60 USDG","empty","3 USDG / week"],
  ["Ash Forge","workshop","140 USDG","empty","6 USDG / week"],
  ["Glass and Wick","shop","95 USDG","10 USDG","4 USDG / week"],
  ["The Ledger","shop","100 USDG","empty","4 USDG / week"],
  ["Spice Drawer","shop","85 USDG","8 USDG","4 USDG / week"],
  ["The Count","civic","220 USDG","city cut","not for rent"],
  ["Paper Lane","shop","65 USDG","empty","3 USDG / week"],
  ["The Dye Pot","shop","70 USDG","empty","3 USDG / week"],
  ["Iron Bell","shop","90 USDG","empty","4 USDG / week"],
  ["The Yard","workshop","120 USDG","empty","5 USDG / week"],
  ["Barrel and Bone","shop","80 USDG","12 USDG","4 USDG / week"],
  ["Coal House","shop","55 USDG","empty","2 USDG / week"],
  ["Wick and Tallow","shop","60 USDG","empty","3 USDG / week"],
  ["Low Room","house","50 USDG","empty","not offered"],
  ["Quiet House","house","50 USDG","empty","not offered"],
  ["Night Bed","inn","160 USDG","20 USDG","7 USDG / week"],
  ["Lane End","house","45 USDG","empty","not offered"],
  ["The Crooked Crow","inn","200 USDG","25 USDG","9 USDG / week"]
];
const walk = document.getElementById("walk");
lamps.forEach((L, i) => {
  const d = document.createElement("article");
  d.className = "door";
  d.innerHTML = "<b>"+L[0]+"</b><div class='kind'>"+L[1]+"</div><button>Open</button>";
  d.querySelector("button").onclick = () => openLamp(i);
  walk.appendChild(d);
});
function openLamp(i) {
  const L = lamps[i];
  name.textContent = L[0];
  kind.textContent = L[1]+" on First Wick";
  price.textContent = L[2];
  box.textContent = L[3];
  rent.textContent = L[4];
  note.textContent = "Picture only. Nothing is sold yet.";
  take.disabled = lease.disabled = shop.disabled = false;
  take.textContent = "Take the lamp";
  sheet.classList.add("open");
}
take.onclick = () => { take.textContent = "Not for sale yet"; take.disabled = true; };
lease.onclick = () => { note.textContent = "A week on the sign. The box stays with the key."; lease.disabled = true; };
shop.onclick = () => { note.textContent = "The shop door is not built yet."; shop.disabled = true; };
</script>
</body>
</html>
